name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Vet
        run: go vet -tags=integration ./...
      - name: Unit and PostgreSQL integration tests with race detector
        run: go test -race -tags=integration -count=1 -timeout=5m ./...
