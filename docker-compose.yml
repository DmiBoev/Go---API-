version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dept_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: department_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d department_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dept_go_app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=host=db user=postgres password=secretpassword dbname=department_management port=5432 sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
